<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yapp</title>
<link rel="icon" type="image/png" href="yappimg.png">
<link rel="apple-touch-icon" href="yappimg.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Fraunces:ital,opsz@1,20&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --glass:rgba(255,255,255,.14); --glass-strong:rgba(255,255,255,.22); --line:rgba(255,255,255,.35);
    --text:#fff; --sub:rgba(255,255,255,.65);
    --accent:#ff7a59; --bubble-me:rgba(255,122,89,.85); --bubble-them:rgba(255,255,255,.16);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Manrope',system-ui,sans-serif; color:var(--text);
    display:flex; align-items:center; justify-content:center; min-height:100%; overflow:hidden;
    background:#0b0620;
  }
  #bg{position:fixed; inset:0; z-index:0; overflow:hidden;}
  .blob{position:absolute; border-radius:50%; filter:blur(70px); opacity:.75; animation:float 16s ease-in-out infinite;}
  .b1{width:60vw;height:60vw; background:#ff6b9d; top:-15%; left:-15%;}
  .b2{width:55vw;height:55vw; background:#5b7bff; bottom:-20%; right:-10%; animation-delay:-5s;}
  .b3{width:45vw;height:45vw; background:#ffb84d; top:35%; left:40%; animation-delay:-10s;}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(6%,-8%) scale(1.12);}}

  #phone{
    width:420px; max-width:100vw; height:100vh; max-height:900px; position:relative; z-index:1;
    display:flex; flex-direction:column; overflow:hidden;
    background:rgba(255,255,255,.05); backdrop-filter:blur(2px);
  }
  @media(min-width:440px){ #phone{ border-radius:44px; height:880px; border:1px solid var(--line); box-shadow:0 40px 90px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.4);} body{padding:20px;} }

  .glass{
    background:var(--glass); backdrop-filter:blur(24px) saturate(180%); -webkit-backdrop-filter:blur(24px) saturate(180%);
    border:1px solid var(--line); box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 8px 24px rgba(0,0,0,.18);
  }

  /* ---------- ONBOARDING ---------- */
  #onboarding{flex:1; display:flex; flex-direction:column; justify-content:center; padding:30px;}
  .step{display:none; animation:rise .4s cubic-bezier(.2,.8,.2,1);}
  .step.active{display:block;}
  @keyframes rise{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);}}
  .logo{font-family:'Fraunces',serif; font-style:italic; font-size:2.6rem; margin:0 0 6px; text-shadow:0 2px 20px rgba(0,0,0,.25);}
  .lead{color:var(--sub); font-size:.95rem; margin:0 0 26px; line-height:1.5;}
  .field{
    width:100%; padding:16px 18px; border-radius:18px; color:var(--text); font-size:1rem; font-family:inherit;
    outline:none; margin-bottom:14px;
  }
  .field::placeholder{color:var(--sub);}
  .row-cc{display:flex; gap:10px;}
  .row-cc .field:first-child{width:80px; flex-shrink:0; text-align:center;}
  .btn{
    width:100%; padding:16px; border-radius:18px; border:none; background:var(--accent); color:#fff;
    font-weight:800; font-size:1rem; font-family:inherit; cursor:pointer; transition:transform .12s;
    box-shadow:0 8px 20px rgba(255,122,89,.35), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .btn:active{transform:scale(.97);}
  .code-boxes{display:flex; gap:10px; margin-bottom:22px;}
  .code-boxes input{width:100%; aspect-ratio:1; text-align:center; font-size:1.4rem; font-weight:800; border-radius:16px; color:var(--text); outline:none;}
  .swatches{display:flex; gap:12px; margin-bottom:14px;}
  .swatch{width:44px;height:44px;border-radius:50%; cursor:pointer; border:3px solid transparent; transition:transform .15s;}
  .swatch.sel{border-color:#fff; transform:scale(1.12);}
  .hint{color:var(--sub); font-size:.8rem; text-align:center; margin-top:14px;}
  .hint b{color:var(--text); cursor:pointer;}
  .pic-picker{display:flex; justify-content:center; margin-bottom:22px;}
  .pic-circle{
    width:96px;height:96px;border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:2rem; font-weight:800; cursor:pointer; position:relative; overflow:hidden; border:1px solid var(--line);
  }
  .pic-circle img{width:100%;height:100%;object-fit:cover;}
  .pic-circle .cam{position:absolute; bottom:0; right:0; width:30px; height:30px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:.85rem; border:2px solid rgba(255,255,255,.5);}

  /* ---------- APP ---------- */
  #app{display:none; flex:1; flex-direction:column; min-height:0;}
  #app.active{display:flex;}
  .topbar{padding:22px 22px 14px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0;}
  .topbar h1{font-family:'Fraunces',serif; font-style:italic; font-size:1.6rem; margin:0; font-weight:400;}
  .fab{
    width:42px;height:42px;border-radius:15px; display:flex; align-items:center; justify-content:center; cursor:pointer;
    color:var(--text); font-size:1.4rem;
  }
  .view{flex:1; overflow-y:auto; display:none; padding:0 14px 14px;}
  .view.active{display:block;}

  .chatitem{display:flex; align-items:center; gap:12px; padding:12px; border-radius:20px; cursor:pointer; margin-bottom:8px;}
  .chatitem:active{background:rgba(255,255,255,.1);}
  .avatar{
    width:52px;height:52px;border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:800; color:#fff; font-size:1.1rem; flex-shrink:0; position:relative; overflow:hidden; border:1px solid var(--line);
  }
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .pending-dot{position:absolute; bottom:-1px; right:-1px; width:14px; height:14px; border-radius:50%; background:var(--accent2,#ffb84d); border:3px solid rgba(20,10,35,.9);}
  .ci-meta{flex:1; min-width:0;}
  .ci-name{font-weight:700; font-size:.95rem;}
  .ci-last{color:var(--sub); font-size:.82rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ci-time{color:var(--sub); font-size:.72rem;}
  .empty{text-align:center; color:var(--sub); padding:60px 20px; font-size:.9rem; line-height:1.6;}

  .profile-head{display:flex; flex-direction:column; align-items:center; padding:14px 0 26px;}
  .profile-head .avatar{width:100px;height:100px;font-size:2.2rem; margin-bottom:14px; cursor:pointer;}
  .profile-head .cam{position:absolute; bottom:2px; right:2px; width:32px; height:32px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:.9rem; border:2px solid rgba(0,0,0,.3);}
  .profile-head h2{margin:0; font-size:1.2rem;}
  .profile-head p{margin:4px 0 0; color:var(--sub); font-size:.88rem;}
  .plist{border-radius:20px; overflow:hidden; margin-bottom:14px;}
  .prow{padding:15px 18px; border-bottom:1px solid rgba(255,255,255,.12); display:flex; justify-content:space-between; align-items:center; font-size:.9rem;}
  .prow:last-child{border-bottom:none;}
  .prow span:first-child{color:var(--sub);}
  .prow.danger{color:#ff8a8a; cursor:pointer; justify-content:center; font-weight:700;}

  #nav{display:flex; flex-shrink:0; margin:10px 14px 16px; border-radius:22px; padding:6px;}
  .navbtn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 0;
    color:var(--sub); background:none; border:none; border-radius:16px; font-family:inherit; font-size:.66rem; font-weight:700; cursor:pointer;
  }
  .navbtn svg{width:22px;height:22px; stroke:var(--sub); fill:none; stroke-width:1.8; transition:stroke .2s;}
  .navbtn.on{color:#fff; background:rgba(255,255,255,.16);}
  .navbtn.on svg{stroke:#fff; fill:rgba(255,122,89,.35);}

  #thread{position:absolute; inset:0; display:flex; flex-direction:column; transform:translateX(100%); transition:transform .32s cubic-bezier(.2,.8,.2,1); z-index:5;}
  #thread.open{transform:translateX(0);}
  .thead{display:flex; align-items:center; gap:12px; padding:18px 16px 14px; flex-shrink:0;}
  .back{background:none; border:none; color:var(--text); font-size:1.5rem; cursor:pointer; padding:0 4px;}
  .thead .avatar{width:38px;height:38px;font-size:.85rem; cursor:pointer;}
  .thead-name{font-weight:700; font-size:.95rem;}
  .thead-status{font-size:.75rem; color:var(--sub);}
  #msgs{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:3px;}
  .msgrow{max-width:75%; opacity:0; transform:translateY(6px) scale(.98); animation:pop .25s cubic-bezier(.2,.9,.3,1.15) forwards;}
  @keyframes pop{to{opacity:1; transform:translateY(0) scale(1);}}
  .msgrow.me{align-self:flex-end;}
  .msgrow.them{align-self:flex-start;}
  .bub{padding:11px 15px; border-radius:20px; font-size:.9rem; line-height:1.4; backdrop-filter:blur(18px); border:1px solid rgba(255,255,255,.25);}
  .msgrow.me .bub{background:var(--bubble-me); border-bottom-right-radius:5px;}
  .msgrow.them .bub{background:var(--bubble-them); border-bottom-left-radius:5px;}
  .ticks{font-size:.68rem; color:var(--sub); text-align:right; margin-top:2px; margin-right:2px;}
  .ticks.read{color:var(--accent); font-weight:700;}
  #composer{display:flex; gap:8px; padding:12px 14px 16px; flex-shrink:0;}
  #minput{flex:1; padding:12px 16px; border-radius:20px; color:var(--text); font-family:inherit; font-size:.9rem; outline:none;}
  #minput::placeholder{color:var(--sub);}
  #msend{width:44px;height:44px;border-radius:50%; border:none; background:var(--accent); color:#fff; font-size:1.1rem; cursor:pointer; box-shadow:0 6px 16px rgba(255,122,89,.4);}

  #viewer{position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; z-index:50; backdrop-filter:blur(10px);}
  #viewer.open{display:flex;}
  #viewer img{width:260px;height:260px;border-radius:50%; object-fit:cover; border:2px solid rgba(255,255,255,.4);}
  #viewer .initials{width:260px;height:260px;border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:4rem; font-weight:800;}
  #viewer-name{margin-top:16px; font-weight:700; font-size:1.1rem;}
  #viewer-close{position:absolute; top:30px; right:30px; color:#fff; font-size:1.6rem; background:none; border:none; cursor:pointer;}

  /* add-contact modal */
  #addbackdrop{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-end; justify-content:center; z-index:60; backdrop-filter:blur(6px);}
  #addbackdrop.open{display:flex;}
  #addmodal{width:100%; max-width:420px; border-radius:28px 28px 0 0; padding:26px 24px 30px; animation:slideup .3s cubic-bezier(.2,.8,.2,1);}
  @keyframes slideup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  #addmodal h3{font-family:'Fraunces',serif; font-style:italic; font-weight:400; font-size:1.3rem; margin:0 0 4px;}
  #addmodal .lead2{color:var(--sub); font-size:.85rem; margin:0 0 18px;}
  #add-error{color:#ff8a8a; font-size:.82rem; margin:-6px 0 14px; min-height:1em;}
  #add-actions{display:flex; gap:10px; margin-top:4px;}
  #add-actions .btn{background:rgba(255,255,255,.14); box-shadow:none; color:var(--text);}
  #add-actions .btn.primary{background:var(--accent); color:#fff; box-shadow:0 8px 20px rgba(255,122,89,.35);}
  #add-spinner{display:none; text-align:center; color:var(--sub); font-size:.85rem; padding:6px 0 2px;}

  ::-webkit-scrollbar{width:0;}
</style>
</head>
<body>
<div id="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div id="phone">

  <div id="onboarding">
    <div class="step active" id="step-phone">
      <p class="logo">Yapp</p>
      <p class="lead">Escribe tu número para empezar. Es lo único que necesitan tus contactos para encontrarte.</p>
      <div class="row-cc"><input class="field glass" id="cc" value="+34" maxlength="4"><input class="field glass" id="phone-input" placeholder="600 000 000" inputmode="numeric"></div>
      <button class="btn" id="btn-send-code">Enviar código</button>
    </div>
    <div class="step" id="step-code">
      <p class="logo">Yapp</p>
      <p class="lead">Código enviado a <b id="phone-display"></b>. (Simulado: prueba <b>0000</b>).</p>
      <div class="code-boxes">
        <input class="glass" maxlength="1" inputmode="numeric"><input class="glass" maxlength="1" inputmode="numeric">
        <input class="glass" maxlength="1" inputmode="numeric"><input class="glass" maxlength="1" inputmode="numeric">
      </div>
      <button class="btn" id="btn-verify">Verificar</button>
      <p class="hint"><b id="back-to-phone">← cambiar número</b></p>
    </div>
    <div class="step" id="step-profile">
      <p class="logo">Yapp</p>
      <p class="lead">Elige tu foto y tu nombre.</p>
      <div class="pic-picker">
        <div class="pic-circle glass" id="pic-circle" style="background:#ff6b57">
          <span id="pic-initial">?</span><div class="cam">📷</div>
        </div>
        <input type="file" id="pic-input" accept="image/*" style="display:none">
      </div>
      <input class="field glass" id="name-input" placeholder="Tu nombre" maxlength="24">
      <div class="swatches" id="swatches"></div>
      <button class="btn" id="btn-finish">Empezar a usar Yapp</button>
    </div>
  </div>

  <div id="app">
    <div class="topbar">
      <h1 id="view-title">Chats</h1>
      <div class="fab glass" id="fab-add" title="Añadir contacto">+</div>
    </div>
    <div class="view active" id="view-chats"></div>
    <div class="view" id="view-profile"></div>

    <div id="nav" class="glass">
      <button class="navbtn on" data-view="chats"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4V5z" stroke-linejoin="round"/></svg>Chats</button>
      <button class="navbtn" data-view="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>Perfil</button>
    </div>

    <div id="thread">
      <div class="thead">
        <button class="back" id="thread-back">←</button>
        <div class="avatar" id="thread-avatar"></div>
        <div><div class="thead-name" id="thread-name"></div><div class="thead-status" id="thread-status"></div></div>
      </div>
      <div id="msgs"></div>
      <div id="composer">
        <input class="glass" id="minput" placeholder="Mensaje">
        <button id="msend">➤</button>
      </div>
    </div>
  </div>
</div>

<div id="viewer">
  <button id="viewer-close">✕</button>
  <div><div id="viewer-pic"></div><div id="viewer-name"></div></div>
</div>

<div id="addbackdrop">
  <div id="addmodal" class="glass">
    <h3>Nuevo chat</h3>
    <p class="lead2">Solo puedes hablar con gente que ya tenga cuenta en Yapp.</p>
    <input class="field glass" id="add-name" placeholder="Nombre" maxlength="24">
    <div class="row-cc"><input class="field glass" id="add-cc" value="+34" maxlength="4"><input class="field glass" id="add-phone" placeholder="Su teléfono" inputmode="numeric"></div>
    <div id="add-error"></div>
    <div id="add-spinner">Buscando…</div>
    <div id="add-actions">
      <button class="btn" id="add-cancel">Cancelar</button>
      <button class="btn primary" id="add-confirm">Buscar y añadir</button>
    </div>
  </div>
</div>

<script>
/* =============== CONFIG: pega aquí tu firebaseConfig de la consola de Firebase =============== */
const firebaseConfig = {
  apiKey: "AIzaSyAySr57QVrZjnQgNOQu9af9NXB-feKUung",
  authDomain: "yapp-9f1b3.firebaseapp.com",
  projectId: "yapp-9f1b3",
  storageBucket: "yapp-9f1b3.firebasestorage.app",
  messagingSenderId: "1083478912472",
  appId: "1:1083478912472:web:bd9f79a0ae3b9b445016ad"
};
let db = null, auth = null, offline = true, myUid = null;
try{
  if(firebaseConfig.apiKey !== "YOUR_API_KEY"){
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    auth = firebase.auth();
    offline = false;
  }
}catch(e){ console.warn("Firebase no configurado, modo local.", e); }

/* Login anónimo: invisible para el usuario, pero da a cada navegador una identidad
   real que Firestore puede verificar en las reglas de seguridad. */
function ensureAuth(){
  if(!auth) return Promise.resolve();
  return new Promise(resolve=>{
    auth.onAuthStateChanged(u=>{
      if(u){ myUid = u.uid; resolve(); }
      else auth.signInAnonymously().catch(err=>console.error('Auth error', err));
    });
  });
}
/* Ata tu número de teléfono a tu identidad de auth, una sola vez (las reglas no permiten cambiarlo luego). */
async function bindPhoneToUid(phone){
  if(!db || !myUid) return;
  const ref = db.collection('uids').doc(myUid);
  const snap = await ref.get();
  if(!snap.exists) await ref.set({ phone: digits(phone) });
}

const COLORS = ["#ff6b57","#ffb84d","#7dd3c0","#9b8cff","#ff8fc7","#5ec8ff"];
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const digits = p => (p||'').replace(/[^0-9]/g,'');

let user = JSON.parse(localStorage.getItem('yapp_user') || 'null');
let chosenColor = COLORS[0], chosenPhoto = null;
let openChatId = null, openOtherPhone = null;
let unsubChats = null, unsubMsgs = null, unsubOtherUsers = {};
/* modo local (sin firebase configurado) */
let localChats = JSON.parse(localStorage.getItem('yapp_local_chats') || '[]');

function avatarHTML(name, color, photo, size){
  if(photo) return `<img src="${photo}">`;
  return initials(name||'?');
}
function initials(n){ return (n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function goStep(id){ $$('.step').forEach(s=>s.classList.remove('active')); $('#'+id).classList.add('active'); }
function resizeImage(file, cb){
  const img = new Image(); const reader = new FileReader();
  reader.onload = e => { img.onload = () => {
    const c = document.createElement('canvas'); const s = 200;
    c.width = s; c.height = s;
    const ctx = c.getContext('2d');
    const min = Math.min(img.width, img.height);
    ctx.drawImage(img, (img.width-min)/2, (img.height-min)/2, min, min, 0, 0, s, s);
    cb(c.toDataURL('image/jpeg', .82));
  }; img.src = e.target.result; };
  reader.readAsDataURL(file);
}

/* ---------- ONBOARDING ---------- */
$('#btn-send-code').onclick = () => {
  const num = $('#phone-input').value.trim();
  if(num.length < 6) return;
  $('#phone-display').textContent = $('#cc').value + ' ' + num;
  goStep('step-code');
  document.querySelector('.code-boxes input').focus();
};
$('#back-to-phone').onclick = () => goStep('step-phone');
$$('.code-boxes input').forEach((inp,i,arr)=>{ inp.addEventListener('input', ()=>{ if(inp.value && arr[i+1]) arr[i+1].focus(); }); });
$('#btn-verify').onclick = () => {
  const code = [...$$('.code-boxes input')].map(i=>i.value).join('');
  if(code.length < 4) return;
  goStep('step-profile');
};
COLORS.forEach((c,i)=>{
  const d = document.createElement('div');
  d.className = 'swatch' + (i===0?' sel':'');
  d.style.background = c;
  d.onclick = ()=>{ $$('.swatch').forEach(s=>s.classList.remove('sel')); d.classList.add('sel'); chosenColor = c; $('#pic-circle').style.background = c; };
  $('#swatches').appendChild(d);
});
$('#pic-circle').onclick = () => $('#pic-input').click();
$('#pic-input').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  resizeImage(f, dataUrl => { chosenPhoto = dataUrl; $('#pic-circle').innerHTML = `<img src="${dataUrl}"><div class="cam">📷</div>`; });
});
$('#name-input').addEventListener('input', () => { if(!chosenPhoto) $('#pic-initial').textContent = initials($('#name-input').value); });

$('#btn-finish').onclick = async () => {
  const name = $('#name-input').value.trim();
  if(!name) return;
  const phone = $('#cc').value + ' ' + $('#phone-input').value.trim();
  user = { phone, name, color: chosenColor, photo: chosenPhoto };
  localStorage.setItem('yapp_user', JSON.stringify(user));
  await ensureAuth();
  await bindPhoneToUid(phone);
  if(db) await db.collection('users').doc(digits(phone)).set(user);
  launchApp();
};

/* ---------- APP SHELL ---------- */
function launchApp(){
  $('#onboarding').style.display = 'none';
  $('#app').classList.add('active');
  renderChats(); renderProfile();
}
$$('.navbtn').forEach(btn=>{
  btn.onclick = ()=>{
    $$('.navbtn').forEach(b=>b.classList.remove('on')); btn.classList.add('on');
    $$('.view').forEach(v=>v.classList.remove('active'));
    const view = btn.dataset.view;
    $('#view-'+view).classList.add('active');
    $('#view-title').textContent = view === 'chats' ? 'Chats' : 'Perfil';
    $('#fab-add').style.visibility = view === 'chats' ? 'visible' : 'hidden';
  };
});

function openViewer(name, color, photo){
  $('#viewer-pic').innerHTML = photo ? `<img id="vp" src="${photo}">` : `<div class="initials" style="background:${color}">${initials(name)}</div>`;
  $('#viewer-name').textContent = name;
  $('#viewer').classList.add('open');
}
$('#viewer-close').onclick = () => $('#viewer').classList.remove('open');

/* ---------- CHATS LIST ---------- */
function renderChats(){
  Object.values(unsubOtherUsers).forEach(u=>u&&u()); unsubOtherUsers = {};
  const el = $('#view-chats');
  if(db){
    if(unsubChats) unsubChats();
    unsubChats = db.collection('chats').where('participants','array-contains', digits(user.phone))
      .onSnapshot(snap => {
        const items = []; snap.forEach(d => items.push({id:d.id, ...d.data()}));
        items.sort((a,b)=>(b.lastTs?.toMillis?.()||0)-(a.lastTs?.toMillis?.()||0));
        paintChats(el, items, true);
      }, err => { el.innerHTML = `<div class="empty">Revisa tu configuración de Firebase / reglas de Firestore.</div>`; console.error(err); });
  } else {
    paintChats(el, localChats, false);
  }
}
function paintChats(el, items, live){
  if(items.length === 0){
    el.innerHTML = `<div class="empty">Todavía no tienes conversaciones.<br>Toca <b style="color:var(--accent)">+</b> arriba y añade a alguien por su número.${db?'':'<br><br>(Modo local: configura Firebase para hablar con otras personas de verdad.)'}</div>`;
    return;
  }
  el.innerHTML = '';
  items.forEach(c=>{
    const otherPhone = live ? c.participants.find(p=>p!==digits(user.phone)) : c.phone;
    const div = document.createElement('div'); div.className = 'chatitem';
    div.innerHTML = `
      <div class="avatar glass" style="background:${c.color||'#888'}">${avatarHTML(c.name,c.color,c.photo)}${c.registered===false?'<span class="pending-dot"></span>':''}</div>
      <div class="ci-meta"><div class="ci-name">${c.name||'Sin nombre'}</div><div class="ci-last">${c.registered===false?'Aún no está en Yapp':(c.lastMessage||'Di hola 👋')}</div></div>
      <div class="ci-time">${c.lastTs ? timeAgo(c.lastTs.toMillis?c.lastTs.toMillis():c.lastTs) : ''}</div>`;
    div.onclick = () => openThread(c.id, otherPhone, live);
    el.appendChild(div);
    if(live){
      unsubOtherUsers[otherPhone] = db.collection('users').doc(otherPhone).onSnapshot(doc=>{
        if(doc.exists){
          const u = doc.data();
          div.querySelector('.avatar').style.background = u.color;
          div.querySelector('.avatar').innerHTML = avatarHTML(u.name,u.color,u.photo);
          div.querySelector('.ci-name').textContent = u.name;
        }
      });
    }
  });
}
function timeAgo(ts){ const m = Math.floor((Date.now()-ts)/60000); if(m<1) return 'ahora'; if(m<60) return m+'m'; return Math.floor(m/60)+'h'; }

/* ---------- PROFILE ---------- */
function renderProfile(){
  $('#view-profile').innerHTML = `
    <div class="profile-head">
      <div class="avatar glass" id="my-avatar" style="background:${user.color}">${avatarHTML(user.name,user.color,user.photo)}<div class="cam">📷</div></div>
      <input type="file" id="my-pic-input" accept="image/*" style="display:none">
      <h2>${user.name}</h2><p>${user.phone}</p>
    </div>
    <div class="plist glass"><div class="prow"><span>Número</span><span>${user.phone}</span></div></div>
    <div class="plist glass"><div class="prow danger" id="btn-logout">Cerrar sesión</div></div>`;
  $('#my-avatar').onclick = () => $('#my-pic-input').click();
  $('#my-pic-input').addEventListener('change', e => {
    const f = e.target.files[0]; if(!f) return;
    resizeImage(f, async dataUrl => {
      user.photo = dataUrl;
      localStorage.setItem('yapp_user', JSON.stringify(user));
      if(db) await db.collection('users').doc(digits(user.phone)).set(user, {merge:true});
      renderProfile();
    });
  });
  $('#btn-logout').onclick = () => { if(confirm('¿Cerrar sesión y borrar tus datos locales?')){ localStorage.clear(); location.reload(); } };
}

/* ---------- ADD CONTACT (modal con verificación) ---------- */
function openAddModal(){
  $('#add-name').value = ''; $('#add-phone').value = ''; $('#add-error').textContent = '';
  $('#add-spinner').style.display = 'none';
  $('#addbackdrop').classList.add('open');
  $('#add-name').focus();
}
function closeAddModal(){ $('#addbackdrop').classList.remove('open'); }
$('#fab-add').onclick = openAddModal;
$('#add-cancel').onclick = closeAddModal;
$('#addbackdrop').addEventListener('click', e => { if(e.target.id === 'addbackdrop') closeAddModal(); });

$('#add-confirm').onclick = async () => {
  const name = $('#add-name').value.trim();
  const phoneRaw = $('#add-cc').value + ' ' + $('#add-phone').value.trim();
  const otherPhone = digits(phoneRaw);
  const errEl = $('#add-error');
  errEl.textContent = '';

  if(!name){ errEl.textContent = 'Ponle un nombre.'; return; }
  if(otherPhone.length < 8){ errEl.textContent = 'Ese número no parece válido.'; return; }
  if(otherPhone === digits(user.phone)){ errEl.textContent = 'Ese es tu propio número.'; return; }
  if(!db){ errEl.textContent = 'Configura Firebase primero para poder añadir gente real.'; return; }

  $('#add-spinner').style.display = 'block';
  $('#add-confirm').disabled = true;
  try{
    const otherDoc = await db.collection('users').doc(otherPhone).get();
    if(!otherDoc.exists){
      errEl.textContent = 'No hay ningún usuario de Yapp con ese número.';
      return;
    }
    const chatId = [digits(user.phone), otherPhone].sort().join('_');
    await db.collection('chats').doc(chatId).set({
      participants: [digits(user.phone), otherPhone], lastMessage: '', lastTs: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true});
    closeAddModal();
    openThread(chatId, otherPhone, true);
  } catch(e){
    console.error(e);
    errEl.textContent = 'No se pudo comprobar el número. Inténtalo de nuevo.';
  } finally {
    $('#add-spinner').style.display = 'none';
    $('#add-confirm').disabled = false;
  }
};

/* ---------- THREAD ---------- */
function openThread(chatId, otherPhone, live){
  openChatId = chatId; openOtherPhone = otherPhone;
  $('#thread-avatar').onclick = () => {
    if(live){
      db.collection('users').doc(otherPhone).get().then(d=>{
        const u = d.exists ? d.data() : {name:'Desconocido', color:'#888'};
        openViewer(u.name, u.color, u.photo);
      });
    } else {
      const c = localChats.find(c=>c.id===chatId);
      openViewer(c.name, c.color, c.photo);
    }
  };
  if(live){
    db.collection('users').doc(otherPhone).onSnapshot(d=>{
      const u = d.exists ? d.data() : {name:'Sin registrar', color:'#888', photo:null};
      $('#thread-avatar').style.background = u.color;
      $('#thread-avatar').innerHTML = avatarHTML(u.name,u.color,u.photo);
      $('#thread-name').textContent = u.name;
      $('#thread-status').textContent = d.exists ? 'en Yapp' : 'aún no está en Yapp';
    });
    if(unsubMsgs) unsubMsgs();
    unsubMsgs = db.collection('chats').doc(chatId).collection('messages').orderBy('ts')
      .onSnapshot(snap => {
        const msgs = []; snap.forEach(d=>msgs.push({id:d.id, ...d.data()}));
        renderMsgs(msgs, true);
        const unread = snap.docs.filter(d=>d.data().from!==digits(user.phone) && !d.data().read);
        unread.forEach(d=>d.ref.update({read:true}));
      });
  } else {
    const c = localChats.find(c=>c.id===chatId);
    $('#thread-avatar').style.background = c.color;
    $('#thread-avatar').innerHTML = avatarHTML(c.name,c.color,c.photo);
    $('#thread-name').textContent = c.name;
    $('#thread-status').textContent = 'modo local';
    renderMsgs(c.messages, false);
  }
  $('#thread').classList.add('open');
}
$('#thread-back').onclick = () => { $('#thread').classList.remove('open'); if(unsubMsgs) unsubMsgs(); openChatId=null; renderChats(); };

function renderMsgs(msgs, live){
  const el = $('#msgs'); el.innerHTML = '';
  const me = live ? digits(user.phone) : 'me';
  msgs.forEach(m=>{
    const row = document.createElement('div');
    const mine = m.from === me;
    row.className = 'msgrow ' + (mine?'me':'them');
    const ticks = mine ? `<div class="ticks${m.read?' read':''}">${m.read?'✓✓ leído':'✓ enviado'}</div>` : '';
    row.innerHTML = `<div class="bub">${m.text}</div>${ticks}`;
    el.appendChild(row);
  });
  el.scrollTop = el.scrollHeight;
}
$('#msend').onclick = sendMsg;
$('#minput').addEventListener('keydown', e => { if(e.key==='Enter') sendMsg(); });
async function sendMsg(){
  const input = $('#minput'); const text = input.value.trim();
  if(!text || !openChatId) return;
  input.value = '';
  if(db){
    await db.collection('chats').doc(openChatId).collection('messages').add({ from: digits(user.phone), text, read:false, ts: firebase.firestore.FieldValue.serverTimestamp() });
    await db.collection('chats').doc(openChatId).set({ lastMessage:text, lastTs: firebase.firestore.FieldValue.serverTimestamp(), participants:[digits(user.phone), openOtherPhone] }, {merge:true});
  } else {
    const c = localChats.find(c=>c.id===openChatId);
    c.messages.push({from:'me', text, read:false}); c.lastTs = Date.now();
    localStorage.setItem('yapp_local_chats', JSON.stringify(localChats));
    renderMsgs(c.messages, false);
  }
}

(async () => {
  await ensureAuth();
  if(user){ await bindPhoneToUid(user.phone); launchApp(); }
  else { $('#onboarding').style.display = 'flex'; }
})();
</script>
